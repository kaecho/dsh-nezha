name: Release

on:
  push:
    tags:
      - "v*"

# Serialize releases per tag and never cancel a publish half-way.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history and tags are needed to compare this release with older tags.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Tag $TAG matches package.json version $VERSION."

      - name: Determine whether this release is the latest
        id: latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CURRENT="${TAG#v}"
          # Highest version tag that is not the tag being released.
          PREVIOUS="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          LATEST="true"
          if [ -n "$PREVIOUS" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$CURRENT" "${PREVIOUS#v}" | sort -V | tail -n 1)"
            if [ "$HIGHEST" != "$CURRENT" ]; then
              LATEST="false"
            fi
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "previous=${PREVIOUS:-none}" >> "$GITHUB_OUTPUT"
          echo "Latest release: $LATEST (highest previous tag: ${PREVIOUS:-none})"

      - name: Install (no runtime dependencies)
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Check manifest, patch, locales, icon, and syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent | tail -n 1)"
          test -f "$TARBALL"
          EXPECTED="dsh-nezha-${VERSION}.tgz"
          if [ "$TARBALL" != "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED but npm pack produced $TARBALL"
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const version = process.env.VERSION;
            const lines = readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex(line => /^## \[/.test(line) && line.includes(`[${version}]`));
            if (start === -1) {
              console.log(`::warning::CHANGELOG.md has no section for ${version}; using auto-generated notes only.`);
              process.exit(0);
            }
            let end = lines.findIndex((line, index) => index > start && /^## \[/.test(line));
            if (end === -1) end = lines.length;
            const body = lines.slice(start + 1, end).join("\n").trim();
            if (body === "") process.exit(0);
            writeFileSync("release-notes.md", `${body}\n`);
            console.log(`Extracted CHANGELOG notes for ${version}.`);
          '
          if [ -f release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.latest.outputs.latest }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
        run: |
          set -euo pipefail
          # Re-runs (or manual re-tags) update the existing release instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing asset, notes, and latest flag."
            gh release upload "$TAG" "$TARBALL" --clobber
            if [ "$HAS_NOTES" = "true" ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
            gh release edit "$TAG" --latest="$LATEST"
          else
            ARGS=(--verify-tag --title "$TAG" --generate-notes --latest="$LATEST")
            if [ "$HAS_NOTES" = "true" ]; then
              # --notes is prepended to the notes generated by GitHub.
              ARGS+=(--notes "$(< release-notes.md)")
            fi
            gh release create "$TAG" "$TARBALL" "${ARGS[@]}"
          fi

      - name: Summarize release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          URL="$(gh release view "$TAG" --json url --jq '.url')"
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(", ")')"
          LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ "$LATEST_TAG" = "$TAG" ]; then IS_LATEST=true; else IS_LATEST=false; fi
          printf 'Release: %s\nLatest: %s (current latest tag: %s)\nAssets: %s\n' \
            "$URL" "$IS_LATEST" "${LATEST_TAG:-none}" "$ASSETS"
          {
            echo "### Release $TAG"
            echo
            echo "- Latest: \`$IS_LATEST\` (current latest tag: \`${LATEST_TAG:-none}\`)"
            echo "- URL: $URL"
            echo "- Assets: $ASSETS"
          } >> "$GITHUB_STEP_SUMMARY"

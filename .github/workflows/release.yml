name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const expected = `v${pkg.version}`;
            if (process.env.TAG !== expected) {
              console.error(`::error::Tag ${process.env.TAG} does not match package.json version ${pkg.version} (expected ${expected})`);
              process.exit(1);
            }
            console.log(`Tag ${process.env.TAG} matches package.json version ${pkg.version}.`);
          '
      - name: Install (no runtime dependencies)
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Check manifest, patch, locales, icon, and syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Pack tarball
        id: pack
        run: |
          TARBALL="$(npm pack --silent | tail -n 1)"
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pack.outputs.tarball }}" \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
